name: Build debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android platform 35
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Verificar catálogo deportivo
        shell: bash
        run: |
          test "$(wc -l < app/src/main/assets/sports_channels.tsv)" -eq 108
      - name: Test and build
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: enova-iptv-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish:
    name: Publicar APK directa
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar APK compilada
        uses: actions/download-artifact@v4
        with:
          name: enova-iptv-debug-apk
          path: apk
      - name: Crear GitHub Release con APK directa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.0-build.${GITHUB_RUN_NUMBER}"
          mv "apk/app-debug.apk" "apk/Enova-IPTV.apk"
          gh release create "$TAG" "apk/Enova-IPTV.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Enova IPTV · versión de prueba #${GITHUB_RUN_NUMBER}" \
            --notes "APK de prueba para Google TV. Requiere instalación manual y permiso para instalar apps externas. El funcionamiento en televisores reales aún debe validarse. No incluye canales ni contenido audiovisual." \
            --latest
